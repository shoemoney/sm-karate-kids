packages:
  - 'packages/*'
  - 'apps/*'

# esbuild's install script only verifies its prebuilt binary, which pnpm already
# fetches as an optional platform dependency. Nothing needs to run.
allowBuilds:
  esbuild: true

# three@0.187.0, @types/three@0.187.0, vitest 5.1.0 (plus its @vitest/mocker
# and @vitest/spy siblings), and vite@8.3.6 were published inside pnpm's
# built-in 24 hour minimumReleaseAge window, so a frozen install rejects the
# lockfile before anything else runs. These exempt those exact versions. Every
# other release still has to clear the cutoff.
minimumReleaseAgeExclude:
  - three@0.187.0
  - '@types/three@0.187.0'
  - vitest@5.1.0
  - '@vitest/mocker@5.1.0'
  - '@vitest/spy@5.1.0'
  - vite@8.3.6
