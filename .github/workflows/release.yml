name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Gate the release on the full check
        run: pnpm check

      - name: Build the production artifact
        run: pnpm build

      - name: Package and checksum
        id: package
        run: |
          set -euo pipefail
          name="smkk-${GITHUB_REF_NAME}"
          tar -czf "${name}.tar.gz" -C apps/game/dist .
          shasum -a 256 "${name}.tar.gz" > "${name}.sha256"
          echo "archive=${name}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=${name}.sha256" >> "$GITHUB_OUTPUT"
          cat "${name}.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          generate_release_notes: true
